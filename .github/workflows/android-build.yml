name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'scripts/patch-android-signing.js'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: bun install

      - name: Generate native android project
        run: bunx expo prebuild -p android --no-install

      - name: Configure release signing
        run: node scripts/patch-android-signing.js
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Gradle wrapper permissions
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy APK to workspace root
        run: cp android/app/build/outputs/apk/release/app-release.apk uchiha-clan.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uchiha-clan-apk
          path: uchiha-clan.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: UCHIHA Clan Messenger v1.0.0
          body: |
            🏴 اولین نسخه‌ی اندروید UCHIHA Clan Messenger (APK نصب‌شدنی)

            - نصب: فایل را دانلود کنید → اجازه‌ی «نصب از منابع ناشناس» را بدهید → نصب
            - مایکت: همین فایل APK برای آپلود در پنل مایکت استفاده می‌شود
          files: uchiha-clan.apk
